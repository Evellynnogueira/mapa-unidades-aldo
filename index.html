<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100C45">
<title>Posto ALDO mais próximo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--red:#ED1C24;--red-d:#C4141B;--blue:#191261;--night:#100C45;--night2:#1D1778;--ink:#231F20;--gray:#6b6d70;--mist:#C9CCE8;--line:#D9DCEB;--paper:#F4F5FA;
--display:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;--body:'Instrument Sans','Segoe UI',Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--night);overflow:hidden}
.tela{position:absolute;inset:0;display:none;flex-direction:column;height:100dvh}
.tela.on{display:flex}
button{font-family:inherit}

/* ============ CAPA ============ */
#capa{background:radial-gradient(120% 80% at 50% 0%,var(--night2) 0%,var(--night) 60%);color:#fff;align-items:center;justify-content:space-between;padding:max(18px,env(safe-area-inset-top)) 20px max(22px,env(safe-area-inset-bottom));overflow:hidden}
#capa .logo{width:104px;height:auto;display:block;margin-top:6px}
#capa h1{font-family:var(--display);font-weight:900;text-transform:uppercase;text-align:center;margin:10px 0 0;line-height:.95;letter-spacing:.5px}
#capa h1 .a{display:block;font-size:clamp(22px,6.5vw,32px);font-weight:800;color:var(--mist)}
#capa h1 .b{display:block;font-size:clamp(44px,15vw,76px)}
#capa h1 .b em{font-style:normal;color:var(--red)}
#capa h1 .c{display:block;font-size:clamp(26px,8vw,40px);font-weight:800;color:var(--mist);margin-top:4px}
.cena{position:relative;width:min(100%,440px);aspect-ratio:1/.82;overflow:hidden;flex:0 0 auto;margin:6px 0}
.estrada{position:absolute;left:-20%;top:42%;width:150%;height:20%;background:#24242c;transform:rotate(27deg);transform-origin:center;border-top:3px solid #3a3a44;border-bottom:3px solid #3a3a44}
.estrada::after{content:"";position:absolute;left:0;right:0;top:50%;height:3px;background:repeating-linear-gradient(90deg,#f5c518 0 26px,transparent 26px 52px);transform:translateY(-50%)}
.truck{position:absolute;left:-4%;top:-2%;width:78%;transform:translate(-92%,-54%);filter:drop-shadow(0 10px 8px rgba(0,0,0,.45))}
.pump{position:absolute;right:-2%;bottom:-4%;width:40%;filter:drop-shadow(0 8px 8px rgba(0,0,0,.45))}
.cena.go .truck{animation:chega 3.4s cubic-bezier(.16,.7,.25,1) forwards}
@keyframes chega{0%{transform:translate(-92%,-54%)}86%{transform:translate(1.5%,.8%)}93%{transform:translate(0,0) rotate(-.6deg)}100%{transform:translate(0,0)}}
.gota{position:absolute;right:21%;top:41%;width:7px;height:11px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--red);opacity:0}
.cena.go .gota{animation:gota 1.1s 3.4s infinite}
@keyframes gota{0%{opacity:0;transform:translateY(-4px)}20%{opacity:1}100%{opacity:0;transform:translateY(22px)}}
#btnIniciar{background:var(--red);color:#fff;border:0;border-radius:14px;min-height:60px;width:min(100%,360px);font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;box-shadow:0 8px 22px rgba(237,28,36,.45)}
#btnIniciar:active{background:var(--red-d);transform:scale(.98)}
#btnIniciar.pulse{animation:pulso 1.6s infinite}
@keyframes pulso{0%,100%{box-shadow:0 8px 22px rgba(237,28,36,.45)}50%{box-shadow:0 8px 34px rgba(237,28,36,.95)}}
@media (prefers-reduced-motion:reduce){.cena.go .truck{animation:none;transform:none}.cena.go .gota,#btnIniciar.pulse{animation:none}}
@media (max-height:640px){#capa .logo{width:76px}.cena{width:min(100%,330px)}}

/* ============ APP ============ */
#app{background:var(--paper)}
.topo{background:var(--night);color:#fff;padding:max(8px,env(safe-area-inset-top)) 12px 10px;position:relative;z-index:1500}
.linha1{display:flex;align-items:center;gap:8px}
.linha1 h2{flex:1;margin:0;font-family:var(--display);font-weight:900;font-size:22px;text-transform:uppercase;letter-spacing:.5px;line-height:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha1 h2 b{color:var(--red)}
.btn{border:0;border-radius:10px;min-height:44px;padding:0 14px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.home{background:rgba(255,255,255,.12);color:#fff}
.btn.gps{background:var(--red);color:#fff}
.btn.gps:active{background:var(--red-d)}
.linha2{display:flex;gap:8px;margin-top:8px;position:relative}
#busca{flex:1;min-width:0;min-height:46px;padding:0 12px;font-size:16px;border-radius:10px;border:0;font-family:inherit}
#mic{display:none;width:46px;padding:0;background:#fff;color:var(--red);font-size:20px}
#res{position:absolute;left:0;right:0;top:100%;z-index:2000;background:#fff;color:var(--ink);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.4);max-height:46vh;overflow:auto;margin-top:4px}
#res div{padding:14px;border-bottom:1px solid var(--line);font-size:16px;cursor:pointer}
#res small{color:var(--gray);font-size:14px}
#status{font-size:14px;line-height:1.35;color:var(--mist);margin-top:8px;min-height:19px}
#status b{color:#fff}
.corpo{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
#map{flex:1;min-height:0}
#lista{height:30vh;overflow:auto;background:#fff;border-top:1px solid var(--line)}
.item{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;min-height:56px}
.item:active,.item.sel{background:var(--paper)}
.item b{display:block;font-size:16px}
.item small{color:var(--gray);font-size:14px}
.item .d{float:right;font-weight:700;color:var(--blue);font-size:16px}
.item.near{border-left:5px solid var(--red);background:#FFF3F3}
.tag{display:inline-block;background:var(--red);color:#fff;font-size:12px;font-weight:700;border-radius:4px;padding:2px 6px;margin-bottom:4px}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--blue);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.pin.near{background:var(--red);width:34px;height:34px}
.me{width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
.leaflet-tooltip.lbl{background:rgba(255,255,255,.95);border:0;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.35);color:var(--blue);font:700 13px/1 var(--body);padding:4px 6px}
.leaflet-tooltip.lbl::before{display:none}

/* ficha da unidade (bottom sheet) */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:1200;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.35);padding:16px 16px max(16px,env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease}
#sheet.on{transform:none}
#sheet h3{margin:0 28px 2px 0;font-size:18px;color:var(--blue)}
#sheet .dist{font-size:14px;color:var(--red-d);font-weight:700;margin-bottom:6px}
#sheet .fechar{position:absolute;right:8px;top:8px;width:44px;height:44px;border:0;background:none;font-size:26px;color:var(--gray);cursor:pointer}
.endbox{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:10px;padding:10px 12px;margin:8px 0 12px}
.endbox span{flex:1;font-size:15px;line-height:1.3;word-break:break-word}
.endbox button{background:var(--blue);color:#fff;border:0;border-radius:8px;min-height:44px;padding:0 12px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.rota{display:flex;gap:8px}
.rota a{flex:1;min-height:50px;border-radius:10px;font-weight:700;font-size:15px;text-decoration:none;display:flex;align-items:center;justify-content:center;text-align:center}
.rota a.g{background:var(--blue);color:#fff}
.rota a.w{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.leaflet-container{font-family:var(--body)}
</style>
</head>

<script>
// cid = cidade; end = endereço (cadastro ANP/espião, PENDENTE DE VALIDAÇÃO); sem end = só cidade.
var U=[

var $=function(i){return document.getElementById(i);};

/* ---------- capa ---------- */
function toca(){$('cena').classList.add('go');setTimeout(function(){$('btnIniciar').classList.add('pulse');},3400);}
$('btnIniciar').classList.remove('pulse');
requestAnimationFrame(function(){requestAnimationFrame(toca);});
var mapaIniciado=false;
function mostra(id){['capa','app'].forEach(function(t){$(t).classList.toggle('on',t===id);});}
$('btnIniciar').onclick=function(){mostra('app');if(!mapaIniciado){iniciaMapa();mapaIniciado=true;}setTimeout(function(){map.invalidateSize();ajusta();declutter();},60);};
$('btnInicio').onclick=function(){mostra('capa');$('cena').classList.remove('go');void $('cena').offsetWidth;toca();};

/* ---------- utilitários ---------- */
function enderecoCompleto(u){return u.end?u.end+", "+u.cid+" - "+u.uf:null;}
function destino(u){return "Posto Aldo "+(u.end?u.n.replace(/\s*\(.*\)/,'')+(/\((.*)\)/.test(u.n)?" "+u.n.match(/\((.*)\)/)[1]:"")+", "+u.end+", "+u.cid+" - "+u.uf:u.cid+" - "+u.uf);}
function gmaps(u){return "https://www.google.com/maps/dir/?api=1&travelmode=driving&destination="+encodeURIComponent(destino(u));}
function waze(u){return "https://waze.com/ul?ll="+u.lat+","+u.lon+"&navigate=yes";}
function km(a,b,c,d){var R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;var h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h));}
function icon(near){return L.divIcon({className:'',html:'<div class="pin'+(near?' near':'')+'"></div>',iconSize:near?[34,34]:[26,26],iconAnchor:near?[17,34]:[13,26]});}

/* ---------- mapa ---------- */
var map,me=null,order=U.slice(),sel=null;
function ajusta(){map.fitBounds(L.latLngBounds(U.map(function(u){return [u.lat,u.lon];})).pad(.08));}
function iniciaMapa(){
  map=L.map('map',{zoomControl:true,attributionControl:true}).setView([-14,-52],4);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Esri, HERE, Garmin'}).addTo(map);
  U.forEach(function(u){
    u.m=L.marker([u.lat,u.lon],{icon:icon(false),title:u.n}).addTo(map);
    u.m.bindTooltip(u.n,{permanent:true,direction:'top',offset:[0,-26],className:'lbl',opacity:1});
    u.m.on('click',function(){abre(u);});
  });
  map.on('zoomend moveend',declutter);
  render();
}
// mostra o nome de cada posto, escondendo os que se sobrepõem (aparecem ao dar zoom)
function declutter(){
  if(!map)return;
  var feitos=[];
  order.forEach(function(u){
    var t=u.m.getTooltip(),el=t&&t.getElement();if(!el)return;
    var p=map.latLngToContainerPoint(u.m.getLatLng()),w=u.n.length*7.4+16;
    var r={x:p.x-w/2,y:p.y-26-24,w:w,h:22},pin={x:p.x-14,y:p.y-30,w:28,h:30};
    var bate=feitos.some(function(o){return r.x<o.x+o.w&&r.x+r.w>o.x&&r.y<o.y+o.h&&r.y+r.h>o.y;});
    el.style.display=bate?'none':'';
    if(!bate)feitos.push(r);
    feitos.push(pin);
  });
}
function render(){
  var h='';
  order.forEach(function(u,i){
    var near=me&&i===0;
    h+='<div class="item'+(near?' near':'')+(u===sel?' sel':'')+'" data-i="'+U.indexOf(u)+'">'+(near?'<span class="tag">MAIS PRÓXIMO</span>':'')+(u.dist!=null?'<span class="d">'+Math.round(u.dist)+' km</span>':'')+'<b>'+u.n+'</b><small>'+u.uf+(u.end?' · '+u.end:'')+'</small></div>';
  });
  $('lista').innerHTML=h;
  setTimeout(declutter,0);
}
$('lista').addEventListener('click',function(e){var el=e.target.closest('.item');if(!el)return;var u=U[+el.dataset.i];map.setView([u.lat,u.lon],Math.max(map.getZoom(),11));abre(u);});

/* ---------- ficha da unidade ---------- */
function abre(u){
  sel=u;
  $('shNome').textContent='Posto ALDO '+u.n+' – '+u.uf;
  $('shDist').textContent=u.dist!=null?Math.round(u.dist)+' km em linha reta de você':'';
  $('shDist').style.display=u.dist!=null?'':'none';
  var e=enderecoCompleto(u);
  $('shEnd').textContent=e||'Endereço exato: abra pelo Maps ('+u.cid+' - '+u.uf+')';
  $('shCopia').style.display=e?'':'none';
  $('shCopia').textContent='Copiar';
  $('shG').href=gmaps(u);$('shW').href=waze(u);
  $('sheet').classList.add('on');
  var ll=u.m.getLatLng(),pt=map.latLngToContainerPoint(ll),h=$('map').clientHeight;
  if(pt.y>h-210)map.panBy([0,pt.y-(h-230)]);
  render();
}
$('fechar').onclick=function(){$('sheet').classList.remove('on');sel=null;render();};
$('shCopia').onclick=function(){
  var t=$('shEnd').textContent,b=$('shCopia'),ok=function(){b.textContent='Copiado ✓';};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok,function(){velho(t,ok);});}else velho(t,ok);
};
function velho(t,ok){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity=0;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok();}catch(x){}document.body.removeChild(a);}

/* ---------- localização e busca ---------- */
function aplicar(la,lo,fonte){
  U.forEach(function(u){u.dist=km(la,lo,u.lat,u.lon);u.m.setIcon(icon(false));u.m.setZIndexOffset(0);});
  order=U.slice().sort(function(a,b){return a.dist-b.dist;});
  me=true;var n=order[0];
  n.m.setIcon(icon(true));n.m.setZIndexOffset(1000);
  if(window._me)map.removeLayer(window._me);
  window._me=L.marker([la,lo],{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[16,16]}),interactive:false}).addTo(map);
  map.fitBounds([[la,lo],[n.lat,n.lon]],{padding:[50,50],maxZoom:12});
  $('status').innerHTML='Mais próximo'+fonte+': <b>'+n.n+' – '+n.uf+'</b> (~'+Math.round(n.dist)+' km em linha reta; pela estrada é mais).';
  abre(n);
}
$('btnLoc').onclick=function(){
  var st=$('status');
  if(!window.isSecureContext){st.innerHTML='Este link não é seguro (não é https), então o celular bloqueia a localização. <b>Pesquise a cidade</b> acima.';return;}
  if(!navigator.geolocation){st.textContent='Seu aparelho não permite localização. Pesquise a cidade acima.';return;}
  st.textContent='Buscando sua localização…';
  navigator.geolocation.getCurrentPosition(function(p){aplicar(p.coords.latitude,p.coords.longitude,'');},function(e){
    var m={1:'Localização negada para este site. Toque no cadeado ao lado do endereço > Permissões > Localização > Permitir.',2:'Não consegui descobrir sua posição (sem sinal de GPS).',3:'A localização demorou demais. Tente em local aberto.'};
    st.innerHTML=(m[e.code]||'Erro de localização.')+' Ou pesquise a cidade acima.';
  },{enableHighAccuracy:false,timeout:20000,maximumAge:60000});
};
var inp=$('busca'),res=$('res'),tm=null,seq=0;
function buscar(q){
  var id=++seq;
  fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&country_code=BR&language=pt&count=10')
   .then(function(r){return r.json();}).then(function(j){
    if(id!==seq)return;
    var l=(j.results||[]).filter(function(x){return /^PPL|^ADM[34]/.test(x.feature_code||'');});
    if(!l.length){res.innerHTML='<div><small>Nenhuma cidade encontrada. Confira o nome.</small></div>';return;}
    res.innerHTML='';
    l.slice(0,6).forEach(function(x){
      var d=document.createElement('div');d.innerHTML='<b>'+x.name+'</b> <small>'+(x.admin1||'')+'</small>';
      d.onclick=function(){res.innerHTML='';inp.value=x.name+(x.admin1?' - '+x.admin1:'');inp.blur();aplicar(x.latitude,x.longitude,' de '+x.name);};
      res.appendChild(d);
    });
   }).catch(function(){if(id===seq)res.innerHTML='<div><small>Sem internet para buscar a cidade.</small></div>';});
}
inp.oninput=function(){clearTimeout(tm);var q=inp.value.trim();if(q.length<3){res.innerHTML='';return;}tm=setTimeout(function(){buscar(q);},350);};
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,mic=$('mic');
if(SR){
  mic.style.display='inline-flex';
  mic.onclick=function(){
    var r=new SR();r.lang='pt-BR';r.maxAlternatives=1;
    $('status').textContent='🎤 Fale o nome da cidade…';mic.textContent='…';
    r.onresult=function(e){var t=e.results[0][0].transcript.replace(/[.,!?]/g,'');inp.value=t;buscar(t);$('status').textContent='Entendi: "'+t+'". Toque na cidade correta.';};
    r.onerror=function(){$('status').textContent='Não consegui ouvir. Tente de novo ou digite a cidade.';};
    r.onend=function(){mic.textContent='🎤';};
    try{r.start();}catch(x){}
  };
}
</script>
