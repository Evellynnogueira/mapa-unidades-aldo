<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unidades ALDO — Mapa do Motorista</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--red:#ED1C24;--red-d:#C4141B;--blue:#191261;--night:#100C45;--ink:#231F20;--gray:#808284;--line:#D9DCEB;--paper:#F4F5FA;--white:#fff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--paper);display:flex;flex-direction:column}
header{background:var(--night);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1;min-width:180px}
header h1 span{color:var(--red)}
button.loc{background:var(--red);color:#fff;border:0;border-radius:8px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer}
button.loc:active{background:var(--red-d)}
#res{position:absolute;left:0;right:0;top:100%;z-index:2000;background:#fff;color:var(--ink);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.35);max-height:50vh;overflow:auto;margin-top:4px}
#res div{padding:13px 14px;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
#res div:active{background:var(--paper)}
#res small{color:var(--gray)}
#status{font-size:13px;color:var(--mist,#C9CCE8);width:100%}
main{flex:1;display:flex;min-height:0}
#map{flex:1;min-height:300px}
aside{width:340px;max-width:42vw;overflow:auto;background:#fff;border-left:1px solid var(--line)}
.item{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover,.item.sel{background:var(--paper)}
.item b{display:block;font-size:15px}
.item small{color:var(--gray);font-size:12px}
.item .d{float:right;font-weight:700;color:var(--blue);font-size:14px}
.item.near{border-left:5px solid var(--red);background:#FFF3F3}
.tag{display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:4px;padding:2px 6px;margin-bottom:4px}
.pop b{font-size:15px}
.pop .end{color:var(--gray);font-size:12px;margin:4px 0 8px}
.pop a{display:block;text-align:center;text-decoration:none;font-weight:700;border-radius:8px;padding:11px;margin-top:6px;font-size:14px}
.pop a.g{background:var(--blue);color:#fff}
.pop a.w{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--blue);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.pin.near{background:var(--red);width:34px;height:34px}
.me{width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
@media (max-width:760px){
  main{flex-direction:column}
  aside{width:100%;max-width:none;height:38vh;border-left:0;border-top:1px solid var(--line)}
  #map{min-height:0}
}
</style>
</head>
<body>
<header>
  <h1>Unidades <span>ALDO</span> — toque na unidade para abrir a rota</h1>
  <button class="loc" id="btnLoc">📍 Qual é o ALDO mais próximo?</button>
  <div id="alt" style="width:100%;position:relative">
    <div style="display:flex;gap:8px">
      <input id="busca" type="search" autocomplete="off" placeholder="Digite a cidade onde você está…" style="flex:1;min-width:0;padding:12px;font-size:16px;border-radius:8px;border:0">
      <button id="mic" class="loc" style="background:#fff;color:var(--red);display:none" title="Falar o nome da cidade">🎤</button>
    </div>
    <div id="res"></div>
  </div>
  <div id="status">Toque no botão para usar sua localização, ou digite/fale a cidade onde você está.</div>
</header>
<main>
  <div id="map"></div>
  <aside id="lista"></aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// Unidades. "end" = endereço cadastrado (ANP/espião); sem "end" = só cidade -> link usa nome + cidade.
// aprox:true = posição pelo centro do município (pendente de validação do endereço exato).
var U=[
 {n:"Cuiabá",uf:"MT",end:"Av. Ayrton Senna da Silva",lat:-15.6894,lon:-56.0183},
 {n:"Cuiabá (Imigrantes)",uf:"MT",end:"Rod. dos Imigrantes, 1985",lat:-15.6690,lon:-55.9548},
 {n:"Cuiabá (Mangueiras)",uf:"MT",end:"BR-364",lat:-15.6764,lon:-55.9331},
 {n:"Sorriso",uf:"MT",end:"BR-163",lat:-12.6020,lon:-55.7491},
 {n:"Primavera do Leste",uf:"MT",end:"Rua São Paulo, 1470",lat:-15.5734,lon:-54.3279},
 {n:"Rondonópolis",uf:"MT",end:"Av. Industrial, 1325",lat:-16.5053,lon:-54.6502},
 {n:"Rondonópolis (Linho)",uf:"MT",end:"BR-364",lat:-16.5028,lon:-54.6274},
 {n:"Guarantã do Norte",uf:"MT",lat:-9.9622,lon:-54.9121,aprox:1},
 {n:"Jataí (Industrial)",uf:"GO",end:"BR-364, 1205",lat:-17.9199,lon:-51.7384},
 {n:"Jataí (Trevo)",uf:"GO",end:"BR-364 com BR-060",lat:-17.9200,lon:-51.6973},
 {n:"São José dos Pinhais",uf:"PR",end:"Rod. Contorno Leste BR-116, 8171",lat:-25.5593,lon:-49.1501},
 {n:"Maringá",uf:"PR",lat:-23.4205,lon:-51.9333,aprox:1},
 {n:"Paranaguá",uf:"PR",end:"BR-277",lat:-25.5568,lon:-48.5677},
 {n:"Cubatão",uf:"SP",end:"Av. Manoel dos Santos Pereira, 100",lat:-23.8487,lon:-46.3761},
 {n:"Porto Franco",uf:"MA",end:"BR-010",lat:-6.4570,lon:-47.3957},
 {n:"São Luís",uf:"MA",end:"BR-135",lat:-2.6677,lon:-44.2889},
 {n:"Barreiras",uf:"BA",end:"Av. Ahylon Macedo, 13013",lat:-12.1219,lon:-45.0901},
 {n:"Itaituba (KM 30)",uf:"PA",lat:-4.3487,lon:-55.7850},
 {n:"Barcarena",uf:"PA",lat:-1.5119,lon:-48.6195,aprox:1}
];

function destino(u){
  var base=u.n.replace(/\s*\(.*\)/,'');
  var ref=(u.n.match(/\((.*)\)/)||[])[1];
  if(u.end) return "Posto Aldo "+base+(ref?" "+ref:"")+", "+u.end+", "+base+" - "+u.uf;
  return "Posto Aldo "+base+" - "+u.uf;
}
function gmaps(u){return "https://www.google.com/maps/dir/?api=1&travelmode=driving&destination="+encodeURIComponent(destino(u));}
function waze(u){return "https://waze.com/ul?ll="+u.lat+","+u.lon+"&navigate=yes";}
function km(a,b,c,d){var R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;
  var h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h));}

var map=L.map('map').setView([-14,-52],5);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Esri, HERE, Garmin'}).addTo(map);

function popup(u){
  return '<div class="pop"><b>Posto ALDO '+u.n+' – '+u.uf+'</b>'+
    '<div class="end">'+(u.end||'Endereço: ver no Maps')+(u.dist!=null?' · '+Math.round(u.dist)+' km em linha reta':'')+'</div>'+
    '<a class="g" target="_blank" rel="noopener" href="'+gmaps(u)+'">🧭 Abrir rota no Google Maps</a>'+
    '<a class="w" target="_blank" rel="noopener" href="'+waze(u)+'">Abrir no Waze</a></div>';
}
function icon(near){return L.divIcon({className:'',html:'<div class="pin'+(near?' near':'')+'"></div>',iconSize:near?[34,34]:[26,26],iconAnchor:near?[17,34]:[13,26],popupAnchor:[0,-28]});}

U.forEach(function(u){
  u.m=L.marker([u.lat,u.lon],{icon:icon(false),title:u.n}).addTo(map).bindPopup(function(){return popup(u);});
});
map.fitBounds(L.latLngBounds(U.map(function(u){return [u.lat,u.lon];})).pad(.1));

var me=null,order=U.slice(),selected=null;
function render(){
  var h='';
  order.forEach(function(u,i){
    var near=me&&i===0;
    h+='<div class="item'+(near?' near':'')+'" data-i="'+U.indexOf(u)+'">'+
      (near?'<span class="tag">MAIS PRÓXIMO</span>':'')+
      (u.dist!=null?'<span class="d">'+Math.round(u.dist)+' km</span>':'')+
      '<b>'+u.n+'</b><small>'+u.uf+(u.end?' · '+u.end:'')+'</small></div>';
  });
  document.getElementById('lista').innerHTML=h;
}
document.getElementById('lista').addEventListener('click',function(e){
  var el=e.target.closest('.item');if(!el)return;
  var u=U[+el.dataset.i];map.setView([u.lat,u.lon],Math.max(map.getZoom(),11));u.m.openPopup();
});
render();

function aplicar(la,lo,fonte){
  var st=document.getElementById('status');
  U.forEach(function(u){u.dist=km(la,lo,u.lat,u.lon);u.m.setIcon(icon(false));});
  order=U.slice().sort(function(a,b){return a.dist-b.dist;});
  me=true;var n=order[0];
  n.m.setIcon(icon(true));n.m.setZIndexOffset(1000);
  if(window._me)map.removeLayer(window._me);
  window._me=L.marker([la,lo],{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[16,16]}),interactive:false}).addTo(map);
  map.fitBounds([[la,lo],[n.lat,n.lon]],{padding:[60,60],maxZoom:12});
  n.m.openPopup();
  st.innerHTML='ALDO mais próximo'+fonte+': <b>'+n.n+' – '+n.uf+'</b> (~'+Math.round(n.dist)+' km em linha reta; pela estrada é mais).';
  render();
}
var inp=document.getElementById('busca'),res=document.getElementById('res'),tm=null,seq=0;
function norm(t){return t.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
function buscar(q){
  var id=++seq;
  fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&country_code=BR&language=pt&count=10')
   .then(function(r){return r.json();}).then(function(j){
    if(id!==seq)return;
    var l=(j.results||[]).filter(function(x){return /^PPL|^ADM[34]/.test(x.feature_code||'');});
    if(!l.length){res.innerHTML='<div><small>Nenhuma cidade encontrada. Confira o nome.</small></div>';return;}
    res.innerHTML='';
    l.slice(0,6).forEach(function(x){
      var d=document.createElement('div');
      d.innerHTML='<b>'+x.name+'</b> <small>'+(x.admin1||'')+'</small>';
      d.onclick=function(){res.innerHTML='';inp.value=x.name+(x.admin1?' - '+x.admin1:'');aplicar(x.latitude,x.longitude,' de '+x.name);};
      res.appendChild(d);
    });
   }).catch(function(){if(id===seq)res.innerHTML='<div><small>Sem internet para buscar a cidade.</small></div>';});
}
inp.oninput=function(){
  clearTimeout(tm);var q=inp.value.trim();
  if(q.length<3){res.innerHTML='';return;}
  tm=setTimeout(function(){buscar(q);},350);
};
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,mic=document.getElementById('mic');
if(SR){
  mic.style.display='block';
  mic.onclick=function(){
    var r=new SR();r.lang='pt-BR';r.maxAlternatives=1;
    document.getElementById('status').textContent='🎤 Fale o nome da cidade…';mic.textContent='…';
    r.onresult=function(e){var t=e.results[0][0].transcript.replace(/[.,!?]/g,'');inp.value=t;buscar(t);
      document.getElementById('status').textContent='Entendi: "'+t+'". Toque na cidade correta abaixo.';};
    r.onerror=function(){document.getElementById('status').textContent='Não consegui ouvir. Tente de novo ou digite o nome da cidade.';};
    r.onend=function(){mic.textContent='🎤';};
    try{r.start();}catch(x){}
  };
}
document.getElementById('btnLoc').onclick=function(){
  var st=document.getElementById('status');
    if(!window.isSecureContext){
    st.innerHTML='Este link não é seguro (não é https), então o celular bloqueia a localização. Use a pesquisa acima: <b>pesquise a cidade onde você está</b>.';return;}
  if(!navigator.geolocation){st.textContent='Seu aparelho não permite localização. Pesquise a cidade acima.';return;}
  st.textContent='Buscando sua localização…';
  navigator.geolocation.getCurrentPosition(function(p){
    aplicar(p.coords.latitude,p.coords.longitude,'');
  },function(e){
    var m={1:'A permissão de localização está negada para este site. No celular: toque no cadeado ao lado do endereço > Permissões > Localização > Permitir, e tente de novo.',
           2:'Não consegui descobrir sua posição (GPS/sinal indisponível).',
           3:'A localização demorou demais. Tente de novo em local aberto.'};
    st.innerHTML=(m[e.code]||'Erro de localização.')+' Ou pesquise a cidade acima.';
  },{enableHighAccuracy:false,timeout:20000,maximumAge:60000});
};
</script>
</body>
</html>
